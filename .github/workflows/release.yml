name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.0.1)'
        required: true
        type: string
      development_version:
        description: 'Next development version (e.g. 0.0.2-SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          mvn -B versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false
          mvn -B versions:set-property -Dproperty=openclaw.version -DnewVersion=${{ inputs.release_version }}

      - name: Build, sign & deploy to Maven Central
        run: mvn -B clean deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag release
        run: |
          git tag -a "v${{ inputs.release_version }}" -m "Release v${{ inputs.release_version }}"
          git push origin "v${{ inputs.release_version }}"

      - name: Set next development version
        run: |
          mvn -B versions:set -DnewVersion=${{ inputs.development_version }} -DgenerateBackupPoms=false
          mvn -B versions:set-property -Dproperty=openclaw.version -DnewVersion=${{ inputs.development_version }}

      - name: Commit & push next development version
        run: |
          git add -A
          git commit -m "Prepare next development iteration ${{ inputs.development_version }}"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          name: v${{ inputs.release_version }}
          generate_release_notes: true
