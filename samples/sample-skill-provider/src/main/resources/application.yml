openclaw:
  endpoint: http://localhost:1300/
  token: demo-token
  workspace: main
  # Disable tool auto-registration for this skill-focused demo
  auto-register-tool: false
  # Enable skill auto-registration (requires skills.install.allowUploadedArchives on Gateway)
  auto-register-skill: true
  skill:
    # Configure skill directories to scan for SKILL.md files
    directories:
      - src/main/resources/skills

server:
  port: 8081
