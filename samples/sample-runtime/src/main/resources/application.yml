openclaw:
  endpoint: http://localhost:8080
  token: demo-token
  workspace: demo-workspace
  # 可选：指定默认对话 Agent ID，用于路由聊天请求到特定 Agent
  # agent-id: my-agent
  callback:
    path: /openclaw/callback
    enabled: true
  timeout: 30s
  auto-register-tool: false
  log-request: true
  log-response: true

server:
  port: 8081
